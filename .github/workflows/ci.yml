name: CI

on:
  push:
    branches: [main]
  pull_request:

# Static quality gates for NOMOFEE (Next.js 16 standalone + Prisma/Postgres).
#
# - `typecheck-lint` steps are verified-clean locally (2026-10-27:
#   `bunx tsc --noEmit` = 0 errors, eslint = 0 errors).
# - The `build` job is the first unattended execution of `next build` (the
#   dev sandbox policy forbids running builds there), so its first CI run
#   doubles as the production-build verification — if it fails, the fix is
#   made in the repo, not by re-enabling ignoreBuildErrors.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Prisma client generate
        run: bunx prisma generate
        env:
          # generate does not connect — the URL env var only has to exist
          SUPABASE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Type check (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Lint (eslint)
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Proves the migration baseline can build a database from scratch —
      # no more db-push-only schema drift between environments.
      - name: Apply schema from migrations (prisma migrate deploy)
        run: bunx prisma migrate deploy
        env:
          SUPABASE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?connection_limit=10

      - name: Production build (standalone output)
        run: bun run build
        env:
          SUPABASE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?connection_limit=10
          # Build-time placeholders — runtime secrets live in the deployment
          # platform's secret store, never in the repo.
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
