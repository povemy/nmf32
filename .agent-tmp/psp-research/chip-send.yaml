components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MetaPagination:
      type: object
      description: Pagination metadata.
      properties:
        current_page:
          type: integer
          format: int64
          example: 1
          description: Current page number.
        prev_page:
          type: integer
          format: int64
          nullable: true
          example: null
          description: Previous page number, or `null` if on the first page.
        next_page:
          type: integer
          format: int64
          nullable: true
          example: null
          description: Next page number, or `null` if on the last page.
        total_pages:
          type: integer
          format: int64
          example: 1
          description: Total number of pages.
        total_count:
          type: integer
          format: int64
          example: 1
          description: Total number of records.
    Account:
      type: object
      description: CHIP Send account information.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        status:
          example: "active"
          allOf:
            - $ref: '#/components/schemas/SendAccountStatus'
        currency:
          type: string
          example: "MYR"
          allOf:
            - $ref: '#/components/schemas/SendAccountCurrency'
        settlement_convert_approvals_count:
          type: integer
          example: 1
        send_fee:
          type: number
          example: 1
          description: 1 for RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
        send_fee_type:
          type: string
          example: "flat"
          allOf:
            - $ref: '#/components/schemas/FeeType'
        account_verification_fee:
          type: number
          example: 1
          description: 1 for RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
        account_verification_fee_type:
          type: string
          example: "flat"
          allOf:
            - $ref: '#/components/schemas/FeeType'
        convertible_balance_from_statement:
          type: number
          example: 1000
          description: |
            - 1000 represents RM 1,000.
            - In the staging environment, this value is reset daily to a virtual RM 1,000. The RM 1,000 cap applies only to staging.
            - In the production environment, there is no fixed cap; this value reflects the real-time available settlement balance.
          pattern: ^[0-9]*\.*[0-9]{0,2}$
        current_balance:
          type: number
          example: 100
          description: |
            - 100 represents RM 100.
            - Available balance for performing send instructions.
          pattern: ^[0-9]*\.*[0-9]{0,2}$
        created_at:
          readOnly: true
          description: Object creation time in UTC
          type: string
          format: date-time
        updated_at:
          readOnly: true
          description: Object updated time in UTC
          type: string
          format: date-time
    SendLimit:
      type: object
      description: A Send Limit entry that records a balance change on your CHIP Send account.
      required:
        - amount
      properties:
        id:
          type: integer
          format: int64
          example: 1
          readOnly: true
        currency:
          type: string
          example: "MYR"
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/SendAccountCurrency'
        fee_type:
          type: string
          example: "flat"
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/FeeType'
        transaction_type:
          type: string
          example: "out"
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          example: 0
          description: 1 for RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
        fee:
          type: number
          example: 1
          description: 1 for RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
          readOnly: true
        net_amount:
          type: number
          example: -1
          description: -1 for -RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
          readOnly: true
        from_settlement:
          type: string
          format: date
          example: "2023-07-21"
          readOnly: true
        status:
          type: string
          example: "success"
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/SendLimitStatus'
        approvals_required:
          type: integer
          example: 0
          description: Number of approvals required before processing.
          readOnly: true
        approvals_received:
          type: integer
          example: 0
          description: Number of approvals received so far.
          readOnly: true
        created_at:
          readOnly: true
          description: Object creation time in UTC
          type: string
          format: date-time
        updated_at:
          readOnly: true
          description: Object updated time in UTC
          type: string
          format: date-time
    SendLimitBody:
      type: object
      description: Request body for increasing the Send Limit.
      required:
        - amount
      properties:
        amount:
          type: number
          example: 0
          description: 1 for RM 1
          pattern: ^[0-9]*\.*[0-9]{0,2}$
    SendInstruction:
      type: object
      description: A send instruction that initiates a payout to a recipient bank account.
      required:
        - description
        - reference
        - bank_account_id
        - amount
        - email
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: This ID must be stored for future reference.
          readOnly: true
        bank_account_id:
          type: integer
          format: int64
          example: 1
          description: The ID returned by the [Add Bank Account](#/Bank%20Accounts/bank_accounts_create) endpoint.
        amount:
          allOf:
            - $ref: '#/components/schemas/PaymentAmount'
        state:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/SendInstructionState'
        email:
          type: string
          format: email
          example: recipient@example.com
        description:
          type: string
          example: Vendor payout for invoice INV-2024-0892
          maximum: 140
          minimum: 1
          nullable: false
        reference:
          type: string
          maximum: 40
          minimum: 1
          nullable: false
          description: Can be any value.
          example: INV-2024-0892
        receipt_url:
          readOnly: true
          description: Generated receipt URL.
          type: string
          example: https://www.chip-in.asia/receipts/send/95712b0c
        slug:
          readOnly: true
          description: Generated receipt slug.
          type: string
          example: 95712b0c
        created_at:
          readOnly: true
          description: Object creation time in UTC.
          type: string
          format: date-time
        updated_at:
          readOnly: true
          description: Object updated time in UTC.
          type: string
          format: date-time
        send_recipient_receipt:
          type: boolean
          example: true
          description: |
            When `true`, a receipt is delivered to the recipient's email.
            When `false`, no receipt is emailed to the recipient.
    SendInstructionBody:
      type: object
      description: Request body for creating a send instruction.
      required:
        - description
        - reference
        - bank_account_id
        - amount
        - email
      properties:
        bank_account_id:
          type: integer
          format: int64
          example: 1
          description: The ID returned by the [Add Bank Account](#/Bank%20Accounts/bank_accounts_create) endpoint.
        amount:
          allOf:
            - $ref: '#/components/schemas/PaymentAmount'
        email:
          type: string
          format: email
          example: recipient@example.com
        description:
          type: string
          example: Vendor payout for invoice INV-2024-0892
          maximum: 140
          minimum: 1
          nullable: false
        reference:
          type: string
          maximum: 40
          minimum: 1
          nullable: false
          description: Can be any value.
          example: INV-2024-0892
        send_recipient_receipt:
          type: boolean
          default: false
          example: true
          description: |
            When `true`, a receipt is delivered to the recipient's email.
            When `false` (default), no receipt is emailed to the recipient.
    BankAccount:
      type: object
      description: A recipient bank account registered for payouts.
      required:
        - account_number
        - bank_code
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: The ID returned in the response must be stored, as it will be required for subsequent operations.
          readOnly: true
        status:
          example: "verified"
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BankAccountStatus'
        account_number:
          allOf:
            - $ref: '#/components/schemas/BankAccountNumber'
        bank_code:
          allOf:
            - $ref: '#/components/schemas/BankCode'
        group_id:
          type: integer
          format: int64
          nullable: true
          example: null
        name:
          type: string
          minLength: 1
          maxLength: 65535
          example: Ahmad Razali
        reference:
          type: string
          minLength: 1
          maxLength: 65535
          nullable: false
          example: VENDOR-EMP-001
          description: Unique value used to prevent duplicate submissions.
        created_at:
          readOnly: true
          description: Object creation time in UTC.
          type: string
          format: date-time
        is_debiting_account:
          type: boolean
          example: false
          readOnly: true
        is_crediting_account:
          type: boolean
          example: false
          readOnly: true
        updated_at:
          readOnly: true
          description: Object updated time in UTC.
          type: string
          format: date-time
        deleted_at:
          readOnly: true
          description: Object deletion time in UTC.
          type: string
          format: date-time
        rejection_reason:
          type: string
          nullable: true
          maxLength: 65535
          example: null
          readOnly: true
    BankAccountBody:
      type: object
      description: Request body for registering a recipient bank account.
      required:
        - account_number
        - bank_code
        - name
      properties:
        account_number:
          allOf:
            - $ref: '#/components/schemas/BankAccountNumber'
        bank_code:
          allOf:
            - $ref: '#/components/schemas/BankCode'
        name:
          type: string
          minLength: 1
          maxLength: 65535
          example: Ahmad Razali
        reference:
          type: string
          minLength: 1
          maxLength: 65535
          nullable: false
          example: VENDOR-EMP-001
          description: Unique value used to prevent duplicate submissions.
    Group:
      type: object
      description: A group that labels a set of bank accounts (for example, `Vendor Payouts` or `Employee Payroll`).
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minimum: 1
          maximum: 256
          example: Vendor Payouts
        created_at:
          readOnly: true
          description: Object creation time in UTC.
          type: string
          format: date-time
          example: '2024-06-15T08:00:00.000Z'
        updated_at:
          readOnly: true
          description: Object updated time in UTC.
          type: string
          format: date-time
          example: '2024-06-15T08:00:00.000Z'
    GroupBody:
      type: object
      description: Request body for creating a group.
      required:
        - name
      properties:
        name:
          type: string
          minimum: 1
          maximum: 256
          example: Vendor Payouts
    Webhook:
      type: object
      description: A webhook subscription that delivers event notifications to your server.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minimum: 1
          maximum: 256
        public_key:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/PublicKey'
        callback_url:
          allOf:
            - $ref: '#/components/schemas/URL'
        email:
          type: string
          format: email
        event_hooks:
          type: array
          minItems: 1
          uniqueItems: true
          description: List of events to trigger webhook callbacks for.
          items:
            $ref: '#/components/schemas/Event'
        created_at:
          readOnly: true
          description: Object creation time in UTC.
          type: string
          format: date-time
        updated_at:
          readOnly: true
          description: Object updated time in UTC.
          type: string
          format: date-time
    WebhookBody:
      type: object
      description: Request body for creating a webhook subscription.
      required:
        - name
        - callback_url
        - email
        - event_hooks
      properties:
        name:
          type: string
          minimum: 1
          maximum: 256
          example: Send Instruction Notifications
        callback_url:
          allOf:
            - $ref: '#/components/schemas/URL'
        email:
          type: string
          format: email
          example: webhooks@example.com
          description: Email notifications are sent to this address when a callback fails to be delivered.
        event_hooks:
          type: array
          minItems: 1
          uniqueItems: true
          description: List of events to trigger webhook callbacks for.
          items:
            $ref: '#/components/schemas/Event'
          example:
            - budget_allocation_status
            - bank_account_status
            - send_instruction_status
    UnixTimestamp:
      type: integer
      description: Unix timestamp (seconds).
      format: int64
      example: 1619740800
    BankAccountNumber:
      type: string
      minimum: 10
      maximum: 17
      example: 157380112222
      description: The length depends on recipient bank
    BankCode:
      type: string
      example: MBBEMYKL
      description: |
        - `ACDBMYK2`: AEON Bank (M) Berhad
        - `PHBMMYKL`: Affin Bank Berhad
        - `AGOBMYKL`: Agrobank
        - `RJHIMYKL`: Al-Rajhi
        - `MFBBMYKL`: Alliance Bank Malaysia Berhad
        - `ARBKMYKL`: Ambank Malaysia Berhad
        - `BIMBMYKL`: Bank Islam Malaysia Berhad
        - `BKRMMYKL`: Bank Kerjasama Rakyat Malaysia Berhad
        - `BMMBMYKL`: Bank Muamalat Malaysia Bhd
        - `BOFAMY2X`: Bank of America (M) Berhad
        - `BKCHMYKL`: Bank of China (M) Berhad
        - `BOTKMYKX`: Bank of Tokyo-Mitsubishi UFJ (M) Berhad
        - `BSNAMYK1`: Bank Simpanan Nasional Berhad
        - `BNPAMYKL`: BNP Paribas Malaysia Berhad
        - `PCBCMYKL`: China Construction Bank (M) Berhad
        - `CIBBMYKL`: CIMB Bank Berhad
        - `DEUTMYKL`: Deutsche Bank (Malaysia) Berhad
        - `FNXSMYNB`: Finexus Cards Sdn. Bhd.
        - `GXSPMYKL`: GX Bank Berhad
        - `HLBBMYKL`: Hong Leong Bank Berhad
        - `HBMBMYKL`: HSBC Bank Malaysia Berhad
        - `ICBKMYKL`: Industrial and Commercial Bank of China (M) Berhad
        - `CHASMYKX`: JP Morgan Chase Bank Berhad
        - `KFHOMYKL`: Kuwait Finance House
        - `MBBEMYKL`: Maybank Berhad
        - `AFBQMYKL`: MBSB BANK BERHAD
        - `MHCBMYKA`: Mizuho Bank (Malaysia) Berhad
        - `OCBCMYKL`: OCBC Bank Berhad
        - `PBBEMYKL`: Public Bank Berhad
        - `RHBBMYKL`: RHB Bank Berhad
        - `SCBLMYKX`: Standard Chartered Bank Malaysia Berhad
        - `SMBCMYKL`: Sumitomo Mitsui Banking Corporation (M) Berhad
        - `TNGDMYNB`: Touch 'n Go eWallet
        - `UOVBMYKL`: United Overseas Bank Berhad (UOB)
      enum: [PHBMMYKL, AIBBMYKL, BPMBMYKL, MFBBMYKL, ALSRMYK1, RJHIMYKL, ARBKMYKL, AISLMYKL, BIMBMYKL, BKRMMYKL, BMMBMYKL, BSNAMYK1, CIBBMYKL, CTBBMYKL, HLBBMYKL, HLIBMYKL, HBMBMYKL, HMABMYKL, KFHOMYKL, MBBEMYKL, MBISMYKL, OCBCMYKL, OABBMYKL, PBBEMYKL, PIBEMYK1, RHBBMYKL, RHBAMYKL, SCBLMYKX, UOVBMYKL, AFBQMYKL, CHASMYKX]
    PublicKey:
      type: string
      description: PEM-encoded RSA public key for authenticating webhook or callback payloads
      readOnly: true
      example: |-
        -----BEGIN PUBLIC KEY-----
        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA6gLlBKxCB5dxPJbinCzl
        hOfKSgQtOWQQBxmnWIkEVUbqhpnqr3xNYiAvDyMUxYUwuzN44eHO+mR9MZWcSx3c
        bXmKa3gsOzR6GdcOxMGaVxvfje+fujCAlCtO1BP+A9/FS3KcPgCYG1wtAPwA5IAf
        HylL3TsUVIJQFBgiBr6N4Bgapr9eloaFfeYIBRsXmxPKAMJivqxYpLh0V3N4ZFd5
        TGqSEAa4b1ULDr6p0sB2L3QikTdsF0zp03zNceKA6fXDOzD0xWtg9buXvyKwePK4
        M2kcnWBNfsWghrdg0fG3O9bmkaS1oEXydrmJfuiI8h6a64J/1nzooi2yLC9D6Ta0
        S63bbuAHymnQtiNuV7Ixp6IoTGFaS88aTiHaP8rdyWV8JTDFx0qeDzyaGWiYGwEF
        mj/buHCEcRhoajbGkPhYA4YEdn4jy1wZhEr2OMdBPM7mPPI0Hy3hcNJVMVVlrpHe
        IltQATpjlNaJMlRPjbcaiW7dsO3BuF9ZOMGksSOnyYm/AgMBAAE=
        -----END PUBLIC KEY-----
    URL:
      type: string
      format: url
      example: https://api.merchant.example/webhooks/chip-send
      maxLength: 500
    Event:
      type: string
      description: |-
        Available event types and when they are emitted:

        `bank_account_status`: Emitted when a company bank account's status changes. This occurs when CHIP processes the bank account for verification.

        ---

        `budget_allocation_status`: Emitted when a budget allocation's status changes. This occurs when an approver approves the increment.

        ---

        `send_instruction_status`: Emitted when a company send instruction's status changes. This occurs when CHIP processes the instruction with the bank.

        ---
      enum: [bank_account_status, budget_allocation_status, send_instruction_status]
    SendInstructionState:
      type: string
      enum: [received, enquiring, executing, reviewing, accepted, completed, rejected, deleted]
      description: |
        - `received`: The instruction has been received, but processing has not started.
        - `enquiring`: The instruction is pending verification.
        - `executing`: The instruction is pending execution.
        - `reviewing`: The instruction requires further attention. Contact your account manager for troubleshooting.
        - `accepted`: The instruction has been accepted by the service provider but not yet completed. This is commonly related to a beneficiary bank system outage during the request. Successful instructions will be set to `completed` within 24 hours, while unsuccessful instructions will be reviewed before being marked as `rejected`.
        - `completed`: The instruction has completed execution and the recipient should have received the payment.
        - `rejected`: The instruction has been rejected.
        - `deleted`: The instruction has been deleted.
    FeeType:
      type: string
      enum: [flat, percentage]
    TransactionType:
      type: string
      enum: [in, out]
    SendAccountStatus:
      type: string
      enum: [active, pending]
    SendAccountCurrency:
      type: string
      enum: [MYR]
      description: |
        - `MYR`: Ringgit Malaysia (RM)
    SendLimitStatus:
      type: string
      enum: [pending, approved, expired]
      description: Status will remain `pending` until all approvers have approved the send limit increase request.
    PaymentAmount:
      type: string
      pattern: ^[0-9]{1,}\.{0,1}[0-9]{0,2}$
      description: Amount in floating point with maximum of 2 decimal places.
      example: 12.44
    BadRequestResponse:
      type: object
      properties:
        message:
          type: string
          example: "Bad request"
        code:
          type: number
          example: 400
        data:
          type: object
          example: {}
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Unauthorized"
        code:
          type: number
          example: 401
        data:
          type: object
          example: {}
    UnauthorizedActionResponse:
      type: object
      properties:
        message:
          type: string
          example: "You are not authorized to perform this action"
        code:
          type: number
          example: 403
        data:
          type: object
          example: {}
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "success"
        code:
          type: number
          example: 200
        data:
          type: object
          example: {}
    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          example: "Record not found"
        code:
          type: number
          example: 404
        data:
          type: object
          example: {}
    TooManyRequestsResponse:
      type: object
      properties:
        message:
          type: string
          example: "Too many requests. Please try again later."
        code:
          type: number
          example: 429
        data:
          type: object
          properties:
            retry_after:
              type: number
              example: 300
    BankAccountStatus:
      type: string
      enum: [pending, verified, rejected]
      description: |
        - `pending`: The bank account is awaiting verification.
        - `verified`: The bank account has been verified as valid.
        - `rejected`: The bank account is invalid.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponse'
    Unauthorized:
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedResponse'
    UnauthorizedAction:
      description: Unauthorized action request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedActionResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'
    TooManyRequests:
      description: |
        Rate limit exceeded for this API key. Retry after the number of seconds in `Retry-After`.

        `Retry-After`, `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset` are sent on this response only.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. The same value as `data.retry_after`.
          schema:
            type: integer
            example: 300
        X-RateLimit-Limit:
          description: Size of the limit that was exceeded. One of `100`, `60`, `30`, or `300` for the request that was rejected.
          schema:
            type: integer
            example: 100
        X-RateLimit-Remaining:
          description: Requests remaining in the current window. `0` on a `429`.
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Unix timestamp, in seconds, when the window resets. The time of this response plus `Retry-After`.
          schema:
            type: integer
            example: 1792984500
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsResponse'
          example:
            message: Too many requests. Please try again later.
            code: 429
            data:
              retry_after: 300
security:
  - bearerAuth: []
